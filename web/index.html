  <meta name="twitter:image" content="/assets/button-token.webp" />

  <!--
    This is a client-side SPA — a crawler that doesn't execute JS (Twitter, Discord,
    iMessage) only ever sees these static, generic tags, on every route. /press/[n]
    and /wallet/[address] get real per-page tags two ways: a small amount of
    JS-side updating for crawlers that DO execute scripts (see src/lib/pageMeta.ts),
    and a Vercel Edge Function (web/api/og.ts) that serves crawler user-agents a
    server-rendered shell with the real press/wallet data baked in — see that file
    and README's "Event history architecture" section for why.
  -->
  <script src="/config.js"></script>
